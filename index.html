<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Expense Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="header">
      <h1>Student Expense Tracker</h1>
      <div class="total-box">
        <span class="total-label" id="total-label">Total spent</span>
        <span class="total-amount" id="total">₹0.00</span>
      </div>
    </header>

    <section class="card">
      <h2>Add an expense</h2>
      <div class="form">
        <div class="field">
          <label for="name">Expense name</label>
          <input type="text" id="name" placeholder="e.g. Lunch at canteen" maxlength="40">
        </div>
        <div class="field">
          <label for="amount">Amount (₹)</label>
          <input type="number" id="amount" placeholder="0.00" min="0" step="0.01">
        </div>
        <div class="field">
          <label for="category">Category</label>
          <select id="category">
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <button id="add-btn" class="btn-add">Add Expense</button>
      </div>
      <p id="error" class="error" role="alert"></p>
    </section>

    <section class="card">
      <div class="list-header">
        <h2>Your expenses</h2>
        <div class="filter">
          <label for="filter">Show</label>
          <select id="filter">
            <option value="All">All categories</option>
            <option value="Food">Food</option>
            <option value="Travel">Travel</option>
            <option value="Shopping">Shopping</option>
            <option value="Education">Education</option>
            <option value="Other">Other</option>
          </select>
        </div>
      </div>
      <ul id="expense-list" class="expense-list"></ul>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
